name: Build Super Potoo World

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare Release Linux
        run: |
          mkdir -p release-linux
          cp build/SuperPotooWorld release-linux/
          cp -r Assets release-linux/
          cp src/*.mp3 release-linux/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperPotooWorld-Linux
          path: release-linux/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare Release Windows
        run: |
          mkdir release-windows
          cp build/Release/SuperPotooWorld.exe release-windows/
          cp -r Assets release-windows/
          cp src/*.mp3 release-windows/
          # Copie des DLLs (Vcpkg les gère souvent, mais pour être sûr)
          cp build/Release/*.dll release-windows/ 2>$null || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperPotooWorld-Windows
          path: release-windows/
