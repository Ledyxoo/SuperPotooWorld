name: Build Super Potoo World

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libomp-dev

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare Release Linux
        run: |
          mkdir -p SuperPotooWorld-Linux
          cp build/SuperPotooWorld SuperPotooWorld-Linux/
          cp -r Assets SuperPotooWorld-Linux/
          cp src/*.mp3 SuperPotooWorld-Linux/
          tar -czvf SuperPotooWorld-Linux.tar.gz SuperPotooWorld-Linux/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperPotooWorld-Linux
          path: SuperPotooWorld-Linux.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare Release Windows
        run: |
          mkdir SuperPotooWorld-Windows
          cp build/Release/SuperPotooWorld.exe SuperPotooWorld-Windows/
          cp -r Assets SuperPotooWorld-Windows/
          cp src/*.mp3 SuperPotooWorld-Windows/
          cp build/Release/*.dll SuperPotooWorld-Windows/ 2>$null || true
          
          # Tentative de récupération de vcomp140.dll (OpenMP) pour la portabilité
          $vcomp = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio" -Filter vcomp140.dll -Recurse | Where-Object { $_.FullName -like "*x64*" -and $_.FullName -like "*Redist*" } | Select-Object -First 1 -ExpandProperty FullName
          if ($vcomp) { cp $vcomp SuperPotooWorld-Windows/ }
          
          Compress-Archive -Path SuperPotooWorld-Windows/* -DestinationPath SuperPotooWorld-Windows.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperPotooWorld-Windows
          path: SuperPotooWorld-Windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: SuperPotooWorld-Linux

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: SuperPotooWorld-Windows

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SuperPotooWorld-Linux.tar.gz
            SuperPotooWorld-Windows.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

